<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Сайт-візитка студента</title>
  <style>
    body { font-family: sans-serif; margin: 40px; background: #f7fafc; color: #111827; }

    h1 { color: #2563eb; }
    button { padding: 8px 16px; background: #2563eb; color: white; border: none; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Сайт-візитка студента</h1>
    <p>Вітаю на моєму сайті! Це навчальний проект.</p>
    <button onclick="alert('Привіт! Все працює!')">Натисни мене</button>
  </div>
  <div class="card">
    <h2>Про мене</h2>
    <p>Студент 1 курсу. Вивчаю веб-розробку.</p>
  </div>
</body>
</html>
